<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEMS Padel Tracker · Barcelona</title>
  <meta name="description" content="Weekly padel hub for CEMS Club Barcelona — venue, price, courts, players and levels.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#home" data-nav="home">
        <img
          class="brand-logo"
          src="assets/cems-club-barcelona-logo.jpg"
          alt="CEMS Club Barcelona"
          onerror="this.replaceWith(Object.assign(document.createElement('span'), {className:'brand-wordmark', textContent:'CEMS Club Barcelona'}))"
        >
        <span class="brand-sub">Padel</span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" type="button">
        <span class="visually-hidden">Menu</span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <a class="nav-link" href="#home" data-view="home">Home</a>
        <a class="nav-link" href="#players" data-view="players">Players</a>
        <a class="nav-link" href="#balance" data-view="balance">Balance</a>
        <a class="nav-link" href="#history" data-view="history">History</a>
        <a class="nav-link" href="#admin" data-view="admin">Admin</a>
      </nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1" aria-live="polite"></main>

  <footer class="site-footer">
    <p>CEMS Club Barcelona &middot; Padel Tracker &middot; built for the club, run entirely in your browser.</p>
  </footer>

  <script src="js/padel-data.js?v=4"></script>
  <script src="js/cems-brands.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
  <script>
    // Mobile nav toggle
    document.getElementById("nav-toggle").addEventListener("click", function () {
      var nav = document.getElementById("site-nav");
      var expanded = this.getAttribute("aria-expanded") === "true";
      this.setAttribute("aria-expanded", String(!expanded));
      nav.classList.toggle("is-open");
    });
    // Close mobile nav after choosing a link
    document.querySelectorAll(".nav-link").forEach(function (link) {
      link.addEventListener("click", function () {
        document.getElementById("site-nav").classList.remove("is-open");
        document.getElementById("nav-toggle").setAttribute("aria-expanded", "false");
      });
    });
  </script>
</body>
</html>
